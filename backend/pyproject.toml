[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "greensynth-analytics"
version = "0.1.0"
description = "Data-Driven Experimental Analysis and Optimization System for Green Synthesis of Semiconductor Materials"
requires-python = ">=3.11"

dependencies = [
    # ── Web framework ──────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Database ───────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",   # Sync driver for Alembic migrations
    "alembic>=1.13.0",

    # ── Validation & Configuration ─────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── Authentication ─────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── HTTP client (for tests) ────────────────────────────
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Scientific computing — installed separately in later phases
scientific = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "plotly>=5.22.0",
]

dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
    "black>=24.4.2",
    "mypy>=1.10.0",
]

# ── Ruff configuration ─────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# ── Black configuration ────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Mypy configuration ─────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest configuration ───────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

# ── Coverage ───────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__init__.py"]
